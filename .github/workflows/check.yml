name: Проверка очередей

on:
  schedule:
    # Запасное расписание раз в час: основной «будильник» — Cron Trigger
    # в Cloudflare (точный, каждые 10 минут), он запускает workflow через
    # GitHub API. Проверки идут круглосуточно; «тихие часы» каждый
    # пользователь настраивает сам в боте (кнопка 🌙).
    - cron: "5 * * * *"
  workflow_dispatch: {}   # кнопка ручного запуска; её же «нажимает» Cloudflare

permissions:
  contents: write

concurrency:
  group: qfinder-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Кэш браузера
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}

      - name: Установка Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Проверка отслеживаемых услуг
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: python bot_check.py

      - name: Сохранение состояния
        run: |
          git config user.name "qfinder-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json services.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "state: $(date -u +%F_%H:%M)" && git push)

      - name: Отладочные файлы
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-${{ github.run_number }}
          path: |
            page_*.png
          if-no-files-found: ignore
          retention-days: 3
